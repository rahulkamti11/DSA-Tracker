    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DSA Tracker",
      "url": "https://mydsatracker.pages.dev",
      "description": "Smart Data Structures & Algorithms tracker for tech interview preparation with topic categorization and revision analytics.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        const theme = localStorage.getItem('dsa_theme') || 'dark';
        let isDark = true;
        if (theme === 'light') isDark = false;
        else if (theme === 'system') isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#020617';
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      })();
    </script>
  </head>
  <body style="overscroll-behavior: none;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
